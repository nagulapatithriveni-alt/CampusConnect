<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CampusConnect - Register</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<nav>

    <div class="logo">
        CampusConnect
    </div>

    <div class="menu">

        <a href="index.html">
            Home
        </a>

        <a href="login.html">
            Login
        </a>

    </div>

</nav>


<section class="application-form register-form">

    <h2>
        Student Registration
    </h2>


    <form id="register-form">

        <label>
            Name
        </label>

        <input
            type="text"
            id="register-name"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            id="register-email"
            required
        >


        <label>
            Phone
        </label>

        <input
            type="tel"
            id="register-phone"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="register-password"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>


    <p id="register-message"></p>


    <p>

        Already registered?

        <a href="login.html">
            Login here
        </a>

    </p>

</section>


<script src="register.js"></script>

</body>

</html>
